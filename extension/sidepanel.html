<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Understanding</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #0f0f0f;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.1rem;
      margin: 0 0 16px 0;
      color: #ffffff;
      border-bottom: 1px solid #272727;
      padding-bottom: 8px;
    }

    .card {
      background-color: #1f1f1f;
      border-radius: 8px;
      padding: 12px 14px;
      border: 1px solid #333333;
    }

    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #aaaaaa;
      margin-bottom: 4px;
    }

    .video-info {
      font-size: 0.95rem;
      font-weight: 500;
      color: #3ea6ff;
      word-break: break-all;
    }

    .hint {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #717171;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Video Understanding</h1>
  <div class="card">
    <div class="label">Status</div>
    <div id="video-id-display" class="video-info">Checking for video...</div>
  </div>
  <p class="hint">Open a YouTube video to test automatic ID detection.</p>

  <script src="sidepanel.js"></script>
</body>
</html>
